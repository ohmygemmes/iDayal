<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="iDayal — La to-do list ultra simple, centrée sur le jour." />
    <meta name="theme-color" content="#3B7DD8" />

    <!-- iOS / Safari PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="iDayal" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Manifest & icons -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="mask-icon" href="./favicon.svg" color="#3B7DD8" />

    <!--
      iDayal ne vit que sur une seule origine. Les données sont dans
      localStorage, qui est cloisonné par origine : deux adresses actives
      donneraient deux listes différentes à la même personne. Les autres noms
      (idayal.fr, idayal.app, ohmygemmes.github.io) ne font que rediriger ici.
    -->
    <link rel="canonical" href="https://idayal.com/" />

    <title>iDayal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
